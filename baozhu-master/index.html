.mode-picks{display:flex;gap:6px;margin:13px 0 14px}.mode-picks button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid #6c806c;

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.setting{display:grid;gap:5px;font-size:12px;color:#d6c9a8}

/* V0.6 · original-inspired menus, no external media */
.overlay{overflow:auto;overscroll-behavior:contain;z-index:5}
.modal{position:relative;isolation:isolate;max-height:calc(100% - 6px);overflow:auto;scrollbar-width:thin}
.modal::before{content:"";position:absolute;inset:6px;border:1px solid #bdac7455;border-radius:10px;pointer-events:none;z-index:-1}

.hall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:12px 0}

.chip:last-child{border-right:0}.chip .k{color:#c8b896;font-size:11px}.chip .v{font-family:Georgia,"Songti SC","SimSun",serif;letter-spacing:.02em;color:#ffe3a2}
.frame{padding:5px;background:linear-gradient(135deg,#5c493c,#c39760 4%,#5b3b2e 8%,#5a3c29 90%,#c1935e 96%,#46352f);

.modal{background:radial-gradient(ellipse at 50% 10%,#526657,#263e39 50%,#122c2e 96%);border:4px ridge #b89a66;

.mode-picks button.active{background:linear-gradient(#9d6747,#6a3f2f);border-color:#f6c778;color:#fff0bc;box-shadow:inset 0 1px 0 #ffe8a955,0 3px 0 #381d18}

/* Craft-built narrative cues: keep the puzzle completely operable. */
.dragon-tip{position:absolute;z-index:3;bottom:7px;left:9px;max-width:min(91%,420px);
 display:flex;gap:5px;align-items:center;pointer-events:none;line-height:1.25;
 border:1px solid #bb925bc2;border-radius:7px;padding:2px 9px 2px 1px;
 background:linear-gradient(115deg,#183830f7,#163029e6 75%,#112523d9);
 box-shadow:inset 0 1px 0 #e2ba6c20,0 3px 12px #0008;opacity:0;transform:translateY(10px);
 transition:opacity .22s,transform .22s}
.dragon-tip[hidden]{display:none!important}.dragon-tip.visible{opacity:1;transform:translateY(0)}
.dragon-tip canvas{flex:0 0 62px;width:62px;height:47px;object-fit:contain}
.dragon-words{text-align:left;display:grid;gap:3px;min-width:0;color:#f7e1b8;
 font-size:12px;letter-spacing:.01em;text-shadow:0 1px #0009}
.dragon-words small{font-size:10px;color:#f3be78;font-family:Georgia,"Songti SC",serif;letter-spacing:.13em}
.cheer{position:absolute;pointer-events:none;z-index:4;top:43%;left:50%;width:max-content;max-width:95%;
 text-align:center;opacity:0;transform:translate(-50%,-33%) scale(.67);filter:drop-shadow(0 4px 1px #26161a);
 transition:none}
.cheer.show{animation:cheer-pop 1.15s cubic-bezier(.22,.8,.38,1) both}
.cheer-label{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(25px,6vw,54px);
 font-weight:900;white-space:nowrap;color:#ffe7a7;-webkit-text-stroke:1px #a95c38;
 text-shadow:0 2px #9c3524,0 0 10px #ffaa46,0 7px 15px #000b}
.cheer.tier-2 .cheer-label{color:#fff4bb;text-shadow:0 2px #ab3723,0 0 18px #ffd076,0 7px 15px #000b}
.cheer.tier-3 .cheer-label{color:#ffe3a0;text-shadow:0 2px #bd3631,0 0 22px #ffdb72,0 0 35px #e66b6b,0 7px 15px #000b}
@keyframes cheer-pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6) rotate(-3deg)}
 16%{opacity:1;transform:translate(-50%,-58%) scale(1.16) rotate(1deg)}
 34%{opacity:1;transform:translate(-50%,-58%) scale(1.01)}
 69%{opacity:1;transform:translate(-50%,-72%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-110%) scale(.97)}}
.dragon-quote{margin:7px 0 8px;font:12px/1.55 "Songti SC","Microsoft YaHei",serif;
 color:#f8d69f;border-left:2px solid #d6a46b;padding:4px 8px;text-align:left;background:#17312c99}
.forge-wealth{color:#e9c47d;font-size:14px;margin:5px 0 9px}

 scroll-snap-type:x proximity}

 border:1px solid #896d47;color:#e8dcaa;border-radius:4px;scroll-snap-align:center;
 display:grid;place-items:center;gap:1px;padding:3px;font-size:11px}
.forge-options button strong{font:800 15px Georgia,"Songti SC",serif}
.forge-options button.active{background:linear-gradient(#a36b43,#6c3d2e);border-color:#ffe0a1;color:#fff5c8}

.app{max-width:925px;padding-top:7px}

function makeStageBoard(){
  const n=BW,cy=Math.floor(BH/2),jx=Math.floor(BW/2),spread=level===1?1:2;
  const solved=Array.from({length:BH},()=>Array(BW).fill(0));
  const add=(x,y,d)=>{if(x>=0&&x<BW&&y>=0&&y<BH)solved[y][x]|=1<<d};
  const segment=(x,y,nx,ny)=>{const d=dirs.findIndex(v=>v[0]===nx-x&&v[1]===ny-y);if(d<0)return;add(x,y,d);add(nx,ny,(d+2)%4)};
  // One left source winds to a central four-way, splitting toward several right-hand rockets.
  add(0,cy,3);for(let x=0;x<n-1;x++)segment(x,cy,x+1,cy);
  for(let step=1;step<=spread;step++){
   for(const sign of [-1,1]){const y=cy+step*sign;
    segment(jx,cy+(step-1)*sign,jx,y);
    for(let x=jx;x<n-1;x++)segment(x,y,x+1,y);
    add(n-1,y,1);
   }
  }
  add(n-1,cy,1);
  // Filler is deliberately inert at the left and right edges; no accidental instant ignition.
  board=solved.map((row,y)=>row.map((m,x)=>{
    if(m)return makeTile(m);
    const filler=x===0?(rand()<.5?mask(0):mask(2)):
      x===n-1?(rand()<.5?mask(0):mask(3)):(1<<ri(4));
    return makeTile(filler);
  }));
  // Three bends in night one; extra junctions must be solved in later nights.
  const breaks=[[jx,cy-1],[jx,cy+1]];
  if(level>=2)breaks.push([jx,cy-2],[jx,cy+2]);
  if(level===3)breaks.push([Math.min(n-2,jx+2),cy]);
  // Later lessons alternate where the right-side key bend occurs.
  if(tutorialWave%2===1&&level>=2)breaks.push([Math.min(n-2,jx+1),cy+1]);
  breaks.push([1,cy]); // Source latch last: teach setup, then simultaneous launch.
  lessonRotations=[];
  for(const [x,y] of breaks){const t=board[y]?.[x];if(!t)continue;
    const goalMask=t.m;for(let i=0;i<3;i++)t.m=rotateMask(t.m);
    lessonRotations.push({x,y,solved:goalMask});}
  if(level===3){const cx=Math.min(BW-2,jx+1),cy2=cy;
    board[cy2][cx].bonus={kind:'yuanbao',value:280+level*35};}
  firstLessonSolved=false;net=networks();boardDirty=true;
}

function step(dt){if(!started||paused||over)return;sceneClock+=dt;updateDragonHint(dt);updateCheer(dt);updateBonusEffects(dt);

  for(let i=taps.length-1;i>=0;i--){taps[i].age+=dt;if(taps[i].age>=taps[i].life)taps.splice(i,1)}
  for(let i=floaters.length-1;i>=0;i--){floaters[i].age+=dt;if(floaters[i].age>=floaters[i].life)floaters.splice(i,1)}
  if(flashScreen>0)flashScreen=Math.max(0,flashScreen-dt*1.6);if(lockPulse){lockPulse.age+=dt;if(lockPulse.age>.55)lockPulse=null}for(let i=crackerPops.length-1;i>=0;i--){crackerPops[i].age+=dt;if(crackerPops[i].age>crackerPops[i].life)crackerPops.splice(i,1)}
  if(mode==='classic'){if(freezeTime>0)freezeTime=Math.max(0,freezeTime-dt);else time=Math.max(0,time-dt);
    if(time<=levelTimeMax*.28&&time>0)dragonHint('urgency');
    if(time<=0){if(roundScore>=goal){if(!fire&&settling<=0&&dropClock<=0)beginLevelClear();}else{finish('灯笼熄尽');return}}}
  if(fire)updateFire(dt);
  if(settling>0){settling-=dt;if(settling<=0){settling=0;settleBoard()}}
  if(dropClock>0){dropClock=Math.max(0,dropClock-dt);if(dropClock===0)checkAuto();}
  if(mode==='arcade'&&settling<=0&&!fire){if(!fall)spawnFalling();if(fall){fallClock+=dt;if(fallClock>=fallPeriod()){
    fallClock-=fallPeriod();fallStep();}}}
  updateParticles(dt);

}
